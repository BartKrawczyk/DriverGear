# MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/drivergear?serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/drivergear?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.datasource.username=your_login
spring.datasource.password=your_password
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


#Spring MVC
spring.mvc.view.prefix=classpath:/templates/
spring.mvc.view.suffix=.html

# Logowanie
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL= DEBUG
logging.level.org.hibernate.type.descriptor.sql= TRACE
server.error.include-stacktrace=always
server.error.include-message=always


#localization
spring.web.locale=pl_PL
spring.web.locale-resolver=fixed

## Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
