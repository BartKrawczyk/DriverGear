<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="components :: site-head">
    <title>Lista działów</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="components :: navigation"></nav>

<div class="container">
    <div th:replace="components :: messages"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Lista działów</h1>
        <div>
            <form th:action="@{/administration/departments}" method="get" class="d-inline-block me-2">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="showInactive" name="showInactive"
                           th:checked="${param.showInactive}" onchange="this.form.submit()">
                    <label class="form-check-label" for="showInactive">Pokaż wszystkie działy</label>
                </div>
            </form>
            <a th:href="@{/administration/departments/new}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Dodaj nowy dział
            </a>
        </div>
    </div>


    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nazwa</th>
                <th>Kod</th>
                <th>Opis</th>
                <th>Status</th>
                <th>Akcje</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="department : ${departments}"
                th:class="${!department.active} ? 'table-secondary' : ''">
                <td th:text="${department.id}">1</td>
                <td th:text="${department.name}">Nazwa</td>
                <td th:text="${department.code}">Kod</td>
                <td th:text="${department.description}">Opis</td>
                <td>
                    <span th:if="${department.active}" class="badge bg-success">Aktywny</span>
                    <span th:if="${!department.active}" class="badge bg-secondary">Nieaktywny</span>
                </td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{/administration/departments/{id}/edit(id=${department.id})}"
                           class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Edytuj
                        </a>
                        <form th:action="@{/administration/departments/{id}(id=${department.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Czy na pewno chcesz usunąć ten dział?')">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="bi bi-trash"></i> Usuń
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(departments)}">
                <td colspan="6" class="text-center">Brak działów</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="components :: footer"></div>
<div th:replace="components :: scripts"></div>
</body>
</html>
