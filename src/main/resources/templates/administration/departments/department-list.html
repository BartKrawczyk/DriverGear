<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="components :: site-head">
    <title>Lista działów</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="components :: navigation"></nav>

<div class="container">
    <!-- Komunikaty -->
    <div th:replace="components :: messages"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Lista działów</h1>
        <a th:href="@{/administration/departments/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Dodaj nowy dział
        </a>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nazwa</th>
                <th>Kod</th>
                <th>Opis</th>
                <th>Akcje</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="department : ${departments}">
                <td th:text="${department.id}">1</td>
                <td th:text="${department.name}">Nazwa</td>
                <td th:text="${department.code}">Kod</td>
                <td th:text="${department.description}">Opis</td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{/administration/departments/{id}/edit(id=${department.id})}"
                           class="btn btn-sm btn-warning">
                            <i class="bi bi-pencil"></i> Edytuj
                        </a>
                        <a th:href="@{/administration/departments/{id}/delete(id=${department.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Czy na pewno chcesz usunąć ten dział?')">
                            <i class="bi bi-trash"></i> Usuń
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(departments)}">
                <td colspan="5" class="text-center">Brak działów</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="components :: footer"></div>
<div th:replace="components :: scripts"></div>
</body>
</html>
