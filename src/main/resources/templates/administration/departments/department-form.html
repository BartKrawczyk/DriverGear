<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main}">
<head>
  <title th:text="${title}">Formularz działu</title>
</head>
<body>
<div layout:fragment="content">
  <div class="container">
    <h2 class="my-4" th:text="${title}">Formularz działu</h2>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
      <span th:text="${errorMessage}"></span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <form th:action="${isNew ? '/administration/departments' : '/administration/departments/' + departmentDTO.id}"
          th:object="${departmentDTO}"
          method="post">
      <div class="mb-3">
        <label for="name" class="form-label">Nazwa</label>
        <input type="text" class="form-control" id="name" th:field="*{name}" required>
        <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>

      <div class="mb-3">
        <label for="code" class="form-label">Kod</label>
        <input type="text" class="form-control" id="code" th:field="*{code}" required>
        <div class="text-danger" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Opis</label>
        <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
        <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
      </div>

      <button type="submit" class="btn btn-primary">Zapisz</button>
      <a th:href="@{/administration/departments}" class="btn btn-secondary">Anuluj</a>
    </form>
  </div>
</div>
</body>
</html>
