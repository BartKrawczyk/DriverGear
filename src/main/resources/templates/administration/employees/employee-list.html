<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="components :: site-head">
  <title>Lista pracowników</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="components :: navigation"></nav>

<div class="container">
  <div th:replace="components :: messages"></div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Lista pracowników</h1>
    <div>
      <form th:action="@{/administration/employees}" method="get" class="d-inline-block me-2">
        <div class="input-group">
          <select class="form-select" id="departmentId" name="departmentId" onchange="this.form.submit()">
            <option value="">Wszystkie działy</option>
            <option th:each="dept : ${departments}"
                    th:value="${dept.id}"
                    th:text="${dept.name}"
                    th:selected="${dept.id == selectedDepartmentId}">
            </option>
          </select>
          <div class="form-check form-switch ms-3 d-flex align-items-center">
            <input class="form-check-input" type="checkbox" id="showInactive" name="showInactive"
                   th:checked="${param.showInactive}" onchange="this.form.submit()">
            <label class="form-check-label ms-2" for="showInactive">Pokaż wszystkich pracowników</label>
          </div>
        </div>
      </form>
      <a th:href="@{/administration/employees/new}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> Dodaj nowego pracownika
      </a>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover">
      <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Numer</th>
        <th>Imię</th>
        <th>Nazwisko</th>
        <th>Dział</th>
        <th>Stanowisko</th>
        <th>Status</th>
        <th>Akcje</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="employee : ${employees}"
          th:class="${!employee.active} ? 'table-secondary' : ''">
        <td th:text="${employee.id}">1</td>
        <td th:text="${employee.employeeNumber}">EMP001</td>
        <td th:text="${employee.firstName}">Jan</td>
        <td th:text="${employee.lastName}">Kowalski</td>
        <td th:text="${employee.departmentName}">Dział IT</td>
        <td th:text="${employee.positionName}">Programista</td>
        <td>
          <span th:if="${employee.active}" class="badge bg-success">Aktywny</span>
          <span th:if="${!employee.active}" class="badge bg-secondary">Nieaktywny</span>
        </td>
        <td>
          <div class="btn-group" role="group">
            <a th:href="@{/administration/employees/{id}/edit(id=${employee.id})}"
               class="btn btn-sm btn-warning">
              <i class="bi bi-pencil"></i> Edytuj
            </a>
            <form th:action="@{/administration/employees/{id}(id=${employee.id})}"
                  method="post" class="d-inline"
                  onsubmit="return confirm('Czy na pewno chcesz usunąć tego pracownika?')">
              <button type="submit" class="btn btn-sm btn-danger">
                <i class="bi bi-trash"></i> Usuń
              </button>
            </form>
          </div>
        </td>
      </tr>
      <tr th:if="${#lists.isEmpty(employees)}">
        <td colspan="8" class="text-center">Brak pracowników</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<div th:replace="components :: footer"></div>
<div th:replace="components :: scripts"></div>
</body>
</html>
