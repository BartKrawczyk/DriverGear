<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="components :: site-head">
  <title th:text="${isNew} ? 'Dodaj stanowisko' : 'Edycja stanowiska'">Stanowisko</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="components :: navigation"></nav>

<div class="container">
  <div th:replace="components :: messages"></div>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header">
          <h2 th:text="${isNew} ? 'Dodaj nowe stanowisko' : 'Edycja stanowiska'">Stanowisko</h2>
        </div>
        <div class="card-body">
          <form th:action="@{${isNew ? '/administration/positions/new' : '/administration/positions/' + position.id}}"
                th:object="${position}" method="post">

            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label for="department" class="form-label">Dział</label>
                  <select id="department" th:field="*{departmentId}" class="form-select" required>
                    <option value="">Wybierz dział</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept.id}"
                            th:text="${dept.name}"
                            th:disabled="${!dept.active}">Dział</option>
                  </select>
                  <div class="form-text" th:if="${selectedDepartmentManager}">
                    Kierownik działu: <span th:text="${selectedDepartmentManager}">Jan Kowalski</span>
                  </div>
                  <div class="text-danger" th:if="${#fields.hasErrors('departmentId')}"
                       th:errors="*{departmentId}"></div>
                </div>

                <div class="mb-3">
                  <label for="name" class="form-label">Nazwa stanowiska</label>
                  <input type="text" class="form-control" id="name" th:field="*{name}" required>
                  <div class="text-danger" th:if="${#fields.hasErrors('name')}"
                       th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                  <label for="code" class="form-label">Kod stanowiska</label>
                  <input type="text" class="form-control" id="code" th:field="*{code}" required
                         pattern="[A-Za-z0-9]+" title="Kod może zawierać tylko litery i cyfry">
                  <div class="text-danger" th:if="${#fields.hasErrors('code')}"
                       th:errors="*{code}"></div>
                </div>
              </div>

              <div class="col-md-6">
                <div class="mb-3">
                  <label for="description" class="form-label">Opis</label>
                  <textarea class="form-control" id="description" th:field="*{description}"
                            rows="3"></textarea>
                  <div class="text-danger" th:if="${#fields.hasErrors('description')}"
                       th:errors="*{description}"></div>
                </div>

                <div class="mb-3" th:if="${!isNew}">
                  <div class="card bg-light">
                    <div class="card-body">
                      <h6 class="card-subtitle mb-2 text-muted">Informacje o stanowisku</h6>
                      <p class="card-text mb-2">
                        <i class="bi bi-people"></i>
                        Liczba pracowników: <span th:text="${employeeCount}">0</span>
                      </p>
                      <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="isActive"
                               th:field="*{isActive}"
                               th:disabled="${!departmentActive}">
                        <label class="form-check-label" for="isActive">
                          Stanowisko aktywne
                        </label>
                        <div class="form-text" th:if="${!departmentActive}">
                          Nie można aktywować stanowiska w nieaktywnym dziale
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
              <a th:href="@{/administration/positions}" class="btn btn-secondary me-md-2">
                <i class="bi bi-x-circle"></i> Anuluj
              </a>
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i>
                <span th:text="${isNew ? 'Dodaj stanowisko' : 'Zapisz zmiany'}">Zapisz</span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="components :: footer"></div>
<div th:replace="components :: scripts"></div>

<script th:if="${!isNew}">
  document.getElementById('department').addEventListener('change', function() {
    const departmentId = this.value;
    if (departmentId) {
      fetch(`/api/departments/${departmentId}/manager`)
              .then(response => response.text())
              .then(managerName => {
                document.getElementById('departmentManagerInfo').textContent =
                        managerName ? `Kierownik działu: ${managerName}` : 'Brak przypisanego kierownika';
              });
    }
  });
</script>
</body>
</html>
