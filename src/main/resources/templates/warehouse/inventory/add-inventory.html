<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="components :: site-head">
  <title>Dodaj do magazynu</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="components :: navigation"></nav>

<div class="container">
  <div th:replace="components :: messages"></div>

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Dodaj do magazynu</h1>
    <a th:href="@{/warehouse}" class="btn btn-secondary">
      <i class="bi bi-arrow-left"></i> Powrót do panelu
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Dodaj nowe przedmioty do magazynu</h5>
        </div>
        <div class="card-body">
          <form th:action="@{/warehouse/inventory/add}" method="post" th:object="${inventoryForm}" class="needs-validation" novalidate>
            <div class="mb-3">
              <label for="clothingTypeId" class="form-label">Typ odzieży:</label>
              <select class="form-select" id="clothingTypeId" th:field="*{clothingTypeId}" required>
                <option value="">-- Wybierz typ odzieży --</option>
                <option th:each="type : ${clothingTypes}" 
                        th:value="${type.id}" 
                        th:text="${type.name}">Nazwa typu odzieży</option>
              </select>
              <div class="invalid-feedback">Proszę wybrać typ odzieży.</div>
            </div>


            <div class="mb-3">
              <label for="quantity" class="form-label">Ilość:</label>
              <input type="number" class="form-control" id="quantity" th:field="*{quantity}" min="1" required>
              <div class="invalid-feedback">Proszę podać ilość (minimum 1).</div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Dodaj do magazynu
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div th:replace="components :: footer"></div>
<div th:replace="components :: scripts"></div>

<script>
  // Enable Bootstrap form validation
  (function() {
    'use strict';
    window.addEventListener('load', function() {
      var forms = document.getElementsByClassName('needs-validation');
      Array.prototype.filter.call(forms, function(form) {
        form.addEventListener('submit', function(event) {
          if (form.checkValidity() === false) {
            event.preventDefault();
            event.stopPropagation();
          }
          form.classList.add('was-validated');
        }, false);
      });
    }, false);
  })();
</script>
</body>
</html>
