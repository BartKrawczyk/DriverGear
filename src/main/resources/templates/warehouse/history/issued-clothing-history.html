<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="components :: site-head">
    <title>Historia wydań</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="components :: navigation"></nav>

<div class="container">
    <div th:replace="components :: messages"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Historia wydań</h1>
        <a th:href="@{/warehouse}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Powrót do panelu
        </a>
    </div>

    <!-- Search Filters -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0">Filtry wyszukiwania</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/warehouse/history/issued-clothing}" method="get" class="row g-3">
                <div class="col-md-4">
                    <label for="firstName" class="form-label">Imię</label>
                    <input type="text" class="form-control" id="firstName" name="firstName" th:value="${firstName}">
                </div>
                <div class="col-md-4">
                    <label for="lastName" class="form-label">Nazwisko</label>
                    <input type="text" class="form-control" id="lastName" name="lastName" th:value="${lastName}">
                </div>
                <div class="col-md-4">
                    <label for="employeeNumber" class="form-label">Numer pracownika</label>
                    <input type="text" class="form-control" id="employeeNumber" name="employeeNumber" th:value="${employeeNumber}">
                </div>
                <div class="col-md-4">
                    <label for="clothingTypeId" class="form-label">Typ ubrania</label>
                    <select class="form-select" id="clothingTypeId" name="clothingTypeId">
                        <option value="">All Clothing Types</option>
                        <option th:each="type : ${clothingTypes}"
                                th:value="${type.id}"
                                th:text="${type.name}"
                                th:selected="${type.id == clothingTypeId}">
                        </option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="startDate" class="form-label">Od daty</label>
                    <input type="date" class="form-control" id="startDate" name="startDate" th:value="${startDate}">
                </div>
                <div class="col-md-4">
                    <label for="endDate" class="form-label">Do daty</label>
                    <input type="date" class="form-control" id="endDate" name="endDate" th:value="${endDate}">
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Szukaj
                    </button>
                    <a th:href="@{/warehouse/history/issued-clothing}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Wyczyść filtry
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>Imię</th>
                <th>Nazwisko</th>
                <th>Numer pracownika</th>
                <th>Typ odzieży</th>
                <th>Data wydania</th>
                <th>Akcja</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="assignment : ${issuedClothingPage.content}">
                <td th:text="${assignment.employeeName.split(' ')[0]}">First Name</td>
                <td th:text="${assignment.employeeName.split(' ')[1]}">Last Name</td>
                <td>
                    <code th:text="${assignment.employeeNumber != null ? assignment.employeeNumber : '-'}">XX00000</code>
                </td>
                <td th:text="${assignment.clothingTypeName}">Clothing Type</td>
                <td th:text="${assignment.issuedDate != null ? #temporals.format(assignment.issuedDate, 'dd.MM.yyyy') : '-'}">01.01.2023</td>
                <td>
                    <a th:href="@{/warehouse/employees/{id}(id=${assignment.employeeId})}" class="btn btn-sm btn-primary">
                        <i class="bi bi-eye"></i> View Employee
                    </a>
                </td>
            </tr>
            <tr th:if="${issuedClothingPage.totalElements == 0}">
                <td colspan="6" class="text-center">No issued clothing found</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div th:if="${issuedClothingPage.totalPages > 1}" class="d-flex justify-content-center mt-4">
        <nav aria-label="Page navigation">
            <ul class="pagination">
                <li class="page-item" th:classappend="${issuedClothingPage.number == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/warehouse/history/issued-clothing(page=0, size=${issuedClothingPage.size}, firstName=${firstName}, lastName=${lastName}, employeeNumber=${employeeNumber}, clothingTypeId=${clothingTypeId}, startDate=${startDate}, endDate=${endDate})}" aria-label="First">
                        <span aria-hidden="true">&laquo;&laquo;</span>
                    </a>
                </li>
                <li class="page-item" th:classappend="${issuedClothingPage.number == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/warehouse/history/issued-clothing(page=${issuedClothingPage.number - 1}, size=${issuedClothingPage.size}, firstName=${firstName}, lastName=${lastName}, employeeNumber=${employeeNumber}, clothingTypeId=${clothingTypeId}, startDate=${startDate}, endDate=${endDate})}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, issuedClothingPage.totalPages - 1)}" th:classappend="${i == issuedClothingPage.number ? 'active' : ''}">
                    <a class="page-link" th:href="@{/warehouse/history/issued-clothing(page=${i}, size=${issuedClothingPage.size}, firstName=${firstName}, lastName=${lastName}, employeeNumber=${employeeNumber}, clothingTypeId=${clothingTypeId}, startDate=${startDate}, endDate=${endDate})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${issuedClothingPage.number == issuedClothingPage.totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/warehouse/history/issued-clothing(page=${issuedClothingPage.number + 1}, size=${issuedClothingPage.size}, firstName=${firstName}, lastName=${lastName}, employeeNumber=${employeeNumber}, clothingTypeId=${clothingTypeId}, startDate=${startDate}, endDate=${endDate})}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
                <li class="page-item" th:classappend="${issuedClothingPage.number == issuedClothingPage.totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/warehouse/history/issued-clothing(page=${issuedClothingPage.totalPages - 1}, size=${issuedClothingPage.size}, firstName=${firstName}, lastName=${lastName}, employeeNumber=${employeeNumber}, clothingTypeId=${clothingTypeId}, startDate=${startDate}, endDate=${endDate})}" aria-label="Last">
                        <span aria-hidden="true">&raquo;&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<div th:replace="components :: footer"></div>
<div th:replace="components :: scripts"></div>
</body>
</html>
