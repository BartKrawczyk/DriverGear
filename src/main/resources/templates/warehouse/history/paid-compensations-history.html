<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="components :: site-head">
    <title>Paid Compensation History</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="components :: navigation"></nav>

<div class="container">
    <div th:replace="components :: messages"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Paid Compensation History</h1>
        <a th:href="@{/warehouse}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <!-- Search Filters -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0">Search Filters</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/warehouse/history/paid-compensations}" method="get" class="row g-3">
                <div class="col-md-4">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" name="firstName" th:value="${firstName}">
                </div>
                <div class="col-md-4">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" name="lastName" th:value="${lastName}">
                </div>
                <div class="col-md-4">
                    <label for="employeeNumber" class="form-label">Employee Number</label>
                    <input type="text" class="form-control" id="employeeNumber" name="employeeNumber" th:value="${employeeNumber}">
                </div>
                <div class="col-md-4">
                    <label for="clothingTypeId" class="form-label">Clothing Type</label>
                    <select class="form-select" id="clothingTypeId" name="clothingTypeId">
                        <option value="">All Clothing Types</option>
                        <option th:each="type : ${clothingTypes}"
                                th:value="${type.id}"
                                th:text="${type.name}"
                                th:selected="${type.id == clothingTypeId}">
                        </option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="startDate" class="form-label">Payment Date From</label>
                    <input type="date" class="form-control" id="startDate" name="startDate" th:value="${startDate}">
                </div>
                <div class="col-md-4">
                    <label for="endDate" class="form-label">Payment Date To</label>
                    <input type="date" class="form-control" id="endDate" name="endDate" th:value="${endDate}">
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Search
                    </button>
                    <a th:href="@{/warehouse/history/paid-compensations}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> Clear Filters
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Employee Number</th>
                <th>Clothing Type</th>
                <th>Amount</th>
                <th>Payment Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="compensation : ${paidCompensationPage.content}">
                <td th:text="${compensation.employeeName.split(' ')[0]}">First Name</td>
                <td th:text="${compensation.employeeName.split(' ')[1]}">Last Name</td>
                <td>
                    <span th:text="${compensation.employeeNumber != null ? compensation.employeeNumber : '-'}">AB12345</span>
                </td>
                <td th:text="${compensation.clothingTypeName}">Clothing Type</td>
                <td th:text="${#numbers.formatDecimal(compensation.amount, 1, 2) + ' zł'}">100.00 zł</td>
                <td th:text="${compensation.paymentDate != null ? #temporals.format(compensation.paymentDate, 'dd.MM.yyyy') : '-'}">01.01.2023</td>
                <td>
                    <a th:href="@{/warehouse/employees/{id}(id=${compensation.employeeId})}" class="btn btn-sm btn-primary">
                        <i class="bi bi-eye"></i> View Employee
                    </a>
                </td>
            </tr>
            <tr th:if="${paidCompensationPage.totalElements == 0}">
                <td colspan="7" class="text-center">No paid compensations found</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div th:if="${paidCompensationPage.totalPages > 1}" class="d-flex justify-content-center mt-4">
        <nav aria-label="Page navigation">
            <ul class="pagination">
                <li class="page-item" th:classappend="${paidCompensationPage.number == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/warehouse/history/paid-compensations(page=0, size=${paidCompensationPage.size}, firstName=${firstName}, lastName=${lastName}, employeeNumber=${employeeNumber}, clothingTypeId=${clothingTypeId}, startDate=${startDate}, endDate=${endDate})}" aria-label="First">
                        <span aria-hidden="true">&laquo;&laquo;</span>
                    </a>
                </li>
                <li class="page-item" th:classappend="${paidCompensationPage.number == 0 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/warehouse/history/paid-compensations(page=${paidCompensationPage.number - 1}, size=${paidCompensationPage.size}, firstName=${firstName}, lastName=${lastName}, employeeNumber=${employeeNumber}, clothingTypeId=${clothingTypeId}, startDate=${startDate}, endDate=${endDate})}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, paidCompensationPage.totalPages - 1)}" th:classappend="${i == paidCompensationPage.number ? 'active' : ''}">
                    <a class="page-link" th:href="@{/warehouse/history/paid-compensations(page=${i}, size=${paidCompensationPage.size}, firstName=${firstName}, lastName=${lastName}, employeeNumber=${employeeNumber}, clothingTypeId=${clothingTypeId}, startDate=${startDate}, endDate=${endDate})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${paidCompensationPage.number == paidCompensationPage.totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/warehouse/history/paid-compensations(page=${paidCompensationPage.number + 1}, size=${paidCompensationPage.size}, firstName=${firstName}, lastName=${lastName}, employeeNumber=${employeeNumber}, clothingTypeId=${clothingTypeId}, startDate=${startDate}, endDate=${endDate})}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>
                <li class="page-item" th:classappend="${paidCompensationPage.number == paidCompensationPage.totalPages - 1 ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/warehouse/history/paid-compensations(page=${paidCompensationPage.totalPages - 1}, size=${paidCompensationPage.size}, firstName=${firstName}, lastName=${lastName}, employeeNumber=${employeeNumber}, clothingTypeId=${clothingTypeId}, startDate=${startDate}, endDate=${endDate})}" aria-label="Last">
                        <span aria-hidden="true">&raquo;&raquo;</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<div th:replace="components :: footer"></div>
<div th:replace="components :: scripts"></div>
</body>
</html>
